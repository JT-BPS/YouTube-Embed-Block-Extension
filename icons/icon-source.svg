<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC83D"/>
      <stop offset="1" stop-color="#F29900"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF3D3D"/>
      <stop offset="1" stop-color="#D90000"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- slide -->
  <rect x="18" y="32" width="92" height="64" rx="9" fill="#FFFFFF" filter="url(#sh)"/>
  <rect x="18" y="32" width="92" height="12" rx="9" fill="#F1F3F4"/>
  <rect x="18" y="38" width="92" height="6" fill="#F1F3F4"/>
  <!-- play badge -->
  <rect x="40" y="50" width="48" height="34" rx="10" fill="url(#red)"/>
  <polygon points="58,58 58,76 74,67" fill="#FFFFFF"/>
  <!-- fixed check -->
  <circle cx="102" cy="100" r="17" fill="#34A853" stroke="#FFFFFF" stroke-width="4"/>
  <polyline points="93,100 99,106 111,94" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
